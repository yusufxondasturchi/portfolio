<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="finBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05101a"/>
      <stop offset="100%" stop-color="#020810"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="20" fill="url(#finBg)"/>
  <rect x="20" y="20" width="760" height="460" rx="16" fill="#091524" stroke="#172b43" stroke-width="2"/>

  <!-- Top bar -->
  <rect x="20" y="20" width="760" height="50" rx="16" fill="#0d1f35"/>
  <circle cx="50" cy="45" r="6" fill="#ef4444"/>
  <circle cx="70" cy="45" r="6" fill="#f59e0b"/>
  <circle cx="90" cy="45" r="6" fill="#10b981"/>
  <text x="120" y="50" fill="#00f0ff" font-family="sans-serif" font-size="14" font-weight="bold">⚡ FinTrack Dashboard</text>

  <!-- Profile & Notification -->
  <circle cx="730" cy="45" r="14" fill="#00f0ff" fill-opacity="0.2"/>
  <text x="730" y="50" fill="#00f0ff" font-size="11" font-weight="bold" text-anchor="middle">FD</text>

  <!-- Metric Cards Row -->
  <!-- Card 1: Total Balance -->
  <g transform="translate(50, 90)">
    <rect width="215" height="90" rx="10" fill="#0d213a" stroke="#00f0ff" stroke-width="1.5"/>
    <text x="20" y="32" fill="#94a3b8" font-family="sans-serif" font-size="12">Jami Balans</text>
    <text x="20" y="65" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="bold">$14,250.00</text>
    <text x="145" y="32" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="bold">+14.2% ↑</text>
  </g>

  <!-- Card 2: Income -->
  <g transform="translate(285, 90)">
    <rect width="215" height="90" rx="10" fill="#0d213a" stroke="#1e3a5f" stroke-width="1"/>
    <text x="20" y="32" fill="#94a3b8" font-family="sans-serif" font-size="12">Oylik Daromad</text>
    <text x="20" y="65" fill="#38bdf8" font-family="sans-serif" font-size="22" font-weight="bold">$4,800.00</text>
    <text x="145" y="32" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="bold">+8.5% ↑</text>
  </g>

  <!-- Card 3: Expenses -->
  <g transform="translate(520, 90)">
    <rect width="215" height="90" rx="10" fill="#0d213a" stroke="#1e3a5f" stroke-width="1"/>
    <text x="20" y="32" fill="#94a3b8" font-family="sans-serif" font-size="12">Oylik Xarajatlar</text>
    <text x="20" y="65" fill="#f43f5e" font-family="sans-serif" font-size="22" font-weight="bold">$2,150.40</text>
    <text x="145" y="32" fill="#f43f5e" font-family="sans-serif" font-size="11" font-weight="bold">-3.2% ↓</text>
  </g>

  <!-- Chart Panel -->
  <g transform="translate(50, 205)">
    <rect width="450" height="245" rx="10" fill="#0b1b2e" stroke="#172b43" stroke-width="1"/>
    <text x="25" y="35" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="bold">Daromad va Xarajat Dinamikasi (2024)</text>
    
    <!-- Grid Lines -->
    <line x1="25" y1="70" x2="425" y2="70" stroke="#172b43" stroke-dasharray="4,4"/>
    <line x1="25" y1="120" x2="425" y2="120" stroke="#172b43" stroke-dasharray="4,4"/>
    <line x1="25" y1="170" x2="425" y2="170" stroke="#172b43" stroke-dasharray="4,4"/>
    <line x1="25" y1="210" x2="425" y2="210" stroke="#223d60"/>

    <!-- Area Chart Path -->
    <path d="M40 180 Q90 140, 150 160 T260 100 T360 80 L410 65 L410 210 L40 210 Z" fill="url(#chartGrad)"/>
    <!-- Line -->
    <path d="M40 180 Q90 140, 150 160 T260 100 T360 80 L410 65" fill="none" stroke="#00f0ff" stroke-width="3"/>
    
    <!-- Points -->
    <circle cx="150" cy="160" r="4" fill="#00f0ff"/>
    <circle cx="260" cy="100" r="4" fill="#00f0ff"/>
    <circle cx="360" cy="80" r="4" fill="#00f0ff"/>
    <circle cx="410" cy="65" r="5" fill="#ffffff" stroke="#00f0ff" stroke-width="2"/>
  </g>

  <!-- Recent Transactions List Panel -->
  <g transform="translate(520, 205)">
    <rect width="215" height="245" rx="10" fill="#0b1b2e" stroke="#172b43" stroke-width="1"/>
    <text x="20" y="32" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="bold">So'nggi O'tkazmalar</text>

    <!-- Item 1 -->
    <g transform="translate(15, 50)">
      <circle cx="16" cy="16" r="14" fill="#1e3a5f"/>
      <text x="16" y="21" fill="#00f0ff" font-size="11" text-anchor="middle">🛒</text>
      <text x="40" y="14" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="bold">Supermarket</text>
      <text x="40" y="27" fill="#64748b" font-family="sans-serif" font-size="9">Bugun, 14:20</text>
      <text x="175" y="20" fill="#f43f5e" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="end">-$45.20</text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(15, 105)">
      <circle cx="16" cy="16" r="14" fill="#1e3a5f"/>
      <text x="16" y="21" fill="#10b981" font-size="11" text-anchor="middle">💼</text>
      <text x="40" y="14" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="bold">Frilans Loyiha</text>
      <text x="40" y="27" fill="#64748b" font-family="sans-serif" font-size="9">Kecha, 18:00</text>
      <text x="175" y="20" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="end">+$650.00</text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(15, 160)">
      <circle cx="16" cy="16" r="14" fill="#1e3a5f"/>
      <text x="16" y="21" fill="#f59e0b" font-size="11" text-anchor="middle">☕</text>
      <text x="40" y="14" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="bold">Qahvaxona</text>
      <text x="40" y="27" fill="#64748b" font-family="sans-serif" font-size="9">12 Oktabr</text>
      <text x="175" y="20" fill="#f43f5e" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="end">-$6.50</text>
    </g>
  </g>
</svg>
