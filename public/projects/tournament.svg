<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="tournBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="neonGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="cardBgT" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14142b"/>
      <stop offset="100%" stop-color="#0c0e1d"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" rx="20" fill="url(#tournBg)"/>
  <rect x="20" y="20" width="760" height="460" rx="16" fill="#0c0d1e" stroke="#1f2347" stroke-width="2"/>

  <!-- Top Browser / Window Bar -->
  <rect x="20" y="20" width="760" height="50" rx="16" fill="#131533"/>
  <circle cx="50" cy="45" r="6" fill="#ef4444"/>
  <circle cx="70" cy="45" r="6" fill="#f59e0b"/>
  <circle cx="90" cy="45" r="6" fill="#10b981"/>

  <text x="120" y="50" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">🏆 TOURNAMENTS &amp; RANKING SYSTEM</text>
  <text x="440" y="50" fill="#6366f1" font-family="monospace" font-size="12">/api/tournaments/ranking • NestJS REST API</text>

  <!-- Tournament Header Banner -->
  <rect x="40" y="86" width="720" height="70" rx="12" fill="url(#cardBgT)" stroke="#312e81" stroke-width="1.5"/>
  <text x="64" y="122" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">Grand Esports Championship 2024</text>
  <text x="64" y="142" fill="#818cf8" font-family="system-ui, sans-serif" font-size="12">Pley-off bosqichi • 32 ta jamoa • Real-time avtomatik ballar hisob-kitobi</text>

  <rect x="620" y="104" width="120" height="34" rx="17" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1"/>
  <text x="640" y="126" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">🔴 LIVE MATCH</text>

  <!-- Left: Tournament Bracket / Match Card -->
  <rect x="40" y="172" width="370" height="284" rx="12" fill="#0f1129" stroke="#1f2347" stroke-width="1.5"/>
  <text x="60" y="202" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">MATCH BRACKET &amp; SETKA</text>

  <!-- Match 1 -->
  <rect x="56" y="218" width="338" height="58" rx="8" fill="#17193b" stroke="#312e81" stroke-width="1"/>
  <text x="70" y="242" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Team Falcon</text>
  <text x="350" y="242" fill="#10b981" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">2</text>
  <line x1="70" y1="250" x2="370" y2="250" stroke="#1f2347" stroke-width="1"/>
  <text x="70" y="266" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Cyber Phoenix</text>
  <text x="350" y="266" fill="#64748b" font-family="system-ui, sans-serif" font-size="13">0</text>

  <!-- Match 2 -->
  <rect x="56" y="290" width="338" height="58" rx="8" fill="#17193b" stroke="#312e81" stroke-width="1"/>
  <text x="70" y="314" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Tashkent Titans</text>
  <text x="350" y="314" fill="#10b981" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">2</text>
  <line x1="70" y1="322" x2="370" y2="322" stroke="#1f2347" stroke-width="1"/>
  <text x="70" y="338" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Samarkand Stars</text>
  <text x="350" y="338" fill="#64748b" font-family="system-ui, sans-serif" font-size="13">1</text>

  <!-- Final Match Card -->
  <rect x="56" y="362" width="338" height="74" rx="8" fill="#1f183d" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="70" y="384" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">🏆 FINAL MATCH</text>
  <text x="70" y="406" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Team Falcon vs Tashkent Titans</text>
  <text x="70" y="424" fill="#38bdf8" font-family="monospace" font-size="11">Bugun 20:00 • Match ID: #TRN-8821</text>

  <!-- Right: Global Leaderboard / Rankings -->
  <rect x="426" y="172" width="334" height="284" rx="12" fill="#0f1129" stroke="#1f2347" stroke-width="1.5"/>
  <text x="446" y="202" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">GLOBAL LEADERBOARD (REYTING)</text>

  <!-- Rank 1 -->
  <rect x="442" y="218" width="302" height="42" rx="8" fill="#2e1065" stroke="#a855f7" stroke-width="1"/>
  <text x="456" y="244" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">#1</text>
  <text x="486" y="244" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Team Falcon</text>
  <text x="680" y="244" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">1,450 pts</text>

  <!-- Rank 2 -->
  <rect x="442" y="268" width="302" height="42" rx="8" fill="#17193b" stroke="#312e81" stroke-width="1"/>
  <text x="456" y="294" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">#2</text>
  <text x="486" y="294" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Tashkent Titans</text>
  <text x="680" y="294" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">1,320 pts</text>

  <!-- Rank 3 -->
  <rect x="442" y="318" width="302" height="42" rx="8" fill="#17193b" stroke="#312e81" stroke-width="1"/>
  <text x="456" y="344" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">#3</text>
  <text x="486" y="344" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Cyber Phoenix</text>
  <text x="680" y="344" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">1,180 pts</text>

  <!-- Rank 4 -->
  <rect x="442" y="368" width="302" height="42" rx="8" fill="#17193b" stroke="#312e81" stroke-width="1"/>
  <text x="456" y="394" fill="#64748b" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">#4</text>
  <text x="486" y="394" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Samarkand Stars</text>
  <text x="680" y="394" fill="#64748b" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">990 pts</text>

  <!-- Tech tags inside -->
  <rect x="442" y="420" width="302" height="24" rx="6" fill="#080914"/>
  <text x="452" y="436" fill="#818cf8" font-family="monospace" font-size="11">PostgreSQL • DTO Validation • REST API</text>
</svg>
