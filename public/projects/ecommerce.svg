<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="ecomBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08101e"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" rx="20" fill="url(#ecomBg)"/>
  <rect x="20" y="20" width="760" height="460" rx="16" fill="#0c1626" stroke="#1e293b" stroke-width="2"/>

  <!-- Browser Header -->
  <rect x="20" y="20" width="760" height="48" rx="16" fill="#0f1d33"/>
  <circle cx="50" cy="44" r="6" fill="#ef4444"/>
  <circle cx="70" cy="44" r="6" fill="#f59e0b"/>
  <circle cx="90" cy="44" r="6" fill="#10b981"/>

  <!-- Search Bar / Address Bar -->
  <rect x="130" y="32" width="400" height="24" rx="12" fill="#081220" stroke="#1e3a5f" stroke-width="1"/>
  <text x="150" y="48" fill="#64748b" font-family="monospace" font-size="11">https://shop-store.demo/products?category=tech</text>

  <!-- Header Right Icons -->
  <circle cx="680" cy="44" r="14" fill="#081220" stroke="#00f0ff" stroke-width="1.5"/>
  <path d="M674 44 h12 M680 38 v12" stroke="#00f0ff" stroke-width="1.5"/>
  <circle cx="720" cy="44" r="14" fill="#00f0ff" fill-opacity="0.2" stroke="#00f0ff" stroke-width="1.5"/>
  <!-- Cart Icon -->
  <path d="M714 40 h3 l2 7 h7 l2 -5 h-12" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Hero Promo Banner Inside Mockup -->
  <rect x="50" y="88" width="700" height="130" rx="12" fill="#112240" stroke="url(#neonCyan)" stroke-width="1.5"/>
  <text x="80" y="135" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="bold">Yangi Avlod Smart Gadjetlar</text>
  <text x="80" y="165" fill="#94a3b8" font-family="sans-serif" font-size="13">Barcha elektronika mahsulotlariga 30% gacha chegirmalar</text>
  <rect x="80" y="180" width="120" height="28" rx="14" fill="url(#neonCyan)"/>
  <text x="140" y="198" fill="#030712" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Xarid Qilish</text>

  <!-- Product Cards Grid -->
  <!-- Card 1 -->
  <g transform="translate(50, 238)">
    <rect width="160" height="215" rx="10" fill="#0d1b2e" stroke="#1e3a5f" stroke-width="1"/>
    <rect x="15" y="15" width="130" height="95" rx="8" fill="#060e1a"/>
    <circle cx="80" cy="62" r="28" fill="#00f0ff" fill-opacity="0.15" stroke="#00f0ff" stroke-width="1"/>
    <!-- Headphone Vector -->
    <path d="M64 62 C64 50, 96 50, 96 62" fill="none" stroke="#00f0ff" stroke-width="2.5"/>
    <rect x="60" y="60" width="8" height="14" rx="3" fill="#00f0ff"/>
    <rect x="92" y="60" width="8" height="14" rx="3" fill="#00f0ff"/>
    <text x="15" y="130" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold">Simsiz Quloqchin Pro</text>
    <text x="15" y="148" fill="#00f0ff" font-family="sans-serif" font-size="13" font-weight="bold">$129.99</text>
    <rect x="15" y="170" width="130" height="28" rx="6" fill="#1e3a5f"/>
    <text x="80" y="188" fill="#e2e8f0" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Savatga Qo'shish</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(230, 238)">
    <rect width="160" height="215" rx="10" fill="#0d1b2e" stroke="#00f0ff" stroke-width="1.5" filter="url(#neonGlow)"/>
    <rect x="15" y="15" width="130" height="95" rx="8" fill="#060e1a"/>
    <circle cx="80" cy="62" r="28" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1"/>
    <!-- Smartwatch Vector -->
    <rect x="68" y="48" width="24" height="30" rx="6" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <line x1="80" y1="42" x2="80" y2="48" stroke="#38bdf8" stroke-width="2"/>
    <line x1="80" y1="78" x2="80" y2="84" stroke="#38bdf8" stroke-width="2"/>
    <text x="15" y="130" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold">Smart Watch Ultra</text>
    <text x="15" y="148" fill="#00f0ff" font-family="sans-serif" font-size="13" font-weight="bold">$249.00</text>
    <rect x="15" y="170" width="130" height="28" rx="6" fill="url(#neonCyan)"/>
    <text x="80" y="188" fill="#030712" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Savatga Qo'shish</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(410, 238)">
    <rect width="160" height="215" rx="10" fill="#0d1b2e" stroke="#1e3a5f" stroke-width="1"/>
    <rect x="15" y="15" width="130" height="95" rx="8" fill="#060e1a"/>
    <circle cx="80" cy="62" r="28" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-width="1"/>
    <rect x="60" y="52" width="40" height="24" rx="4" fill="none" stroke="#818cf8" stroke-width="2"/>
    <text x="15" y="130" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold">Mexanik Klaviatura</text>
    <text x="15" y="148" fill="#00f0ff" font-family="sans-serif" font-size="13" font-weight="bold">$89.50</text>
    <rect x="15" y="170" width="130" height="28" rx="6" fill="#1e3a5f"/>
    <text x="80" y="188" fill="#e2e8f0" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Savatga Qo'shish</text>
  </g>

  <!-- Card 4 -->
  <g transform="translate(590, 238)">
    <rect width="160" height="215" rx="10" fill="#0d1b2e" stroke="#1e3a5f" stroke-width="1"/>
    <rect x="15" y="15" width="130" height="95" rx="8" fill="#060e1a"/>
    <circle cx="80" cy="62" r="28" fill="#00f0ff" fill-opacity="0.1" stroke="#00f0ff" stroke-width="1"/>
    <path d="M68 56 L92 56 L88 74 L72 74 Z" fill="none" stroke="#00f0ff" stroke-width="2"/>
    <text x="15" y="130" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold">O'yin Sichqonchasi</text>
    <text x="15" y="148" fill="#00f0ff" font-family="sans-serif" font-size="13" font-weight="bold">$49.99</text>
    <rect x="15" y="170" width="130" height="28" rx="6" fill="#1e3a5f"/>
    <text x="80" y="188" fill="#e2e8f0" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Savatga Qo'shish</text>
  </g>
</svg>
