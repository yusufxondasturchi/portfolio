<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="gymBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="neonEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111c2e"/>
      <stop offset="100%" stop-color="#0d1522"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="20" fill="url(#gymBg)"/>
  <rect x="20" y="20" width="760" height="460" rx="16" fill="#090f1d" stroke="#1e293b" stroke-width="2"/>

  <!-- Top App Bar -->
  <rect x="20" y="20" width="760" height="52" rx="16" fill="#0f172a"/>
  <circle cx="50" cy="46" r="6" fill="#ef4444"/>
  <circle cx="70" cy="46" r="6" fill="#f59e0b"/>
  <circle cx="90" cy="46" r="6" fill="#10b981"/>

  <text x="120" y="52" fill="#10b981" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">🏋️ FITGYM CRM</text>
  <text x="260" y="52" fill="#64748b" font-family="monospace" font-size="12">/admin/dashboard • NestJS + PostgreSQL</text>

  <!-- Sidebar -->
  <rect x="36" y="88" width="180" height="370" rx="12" fill="#0c1322" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="48" y="104" width="156" height="32" rx="8" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
  <text x="64" y="125" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="600">📊 Dashboard</text>

  <text x="64" y="165" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">👥 Mijozlar (245)</text>
  <text x="64" y="205" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">💳 Abonementlar</text>
  <text x="64" y="245" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">👨‍🏫 Murabbiylar</text>
  <text x="64" y="285" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">📅 Mashg'ulotlar</text>
  <text x="64" y="325" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">💰 To'lovlar &amp; Moliya</text>
  <text x="64" y="365" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">⚙️ Sozlamalar</text>

  <!-- Metric Card 1: Jami mijozlar -->
  <rect x="232" y="88" width="165" height="96" rx="12" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5"/>
  <text x="248" y="112" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">JAMI MIJOZLAR</text>
  <text x="248" y="148" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="bold">245</text>
  <text x="248" y="170" fill="#34d399" font-family="system-ui, sans-serif" font-size="11">+18 bu oyda</text>

  <!-- Metric Card 2: Faol abonement -->
  <rect x="413" y="88" width="165" height="96" rx="12" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5"/>
  <text x="429" y="112" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">FAOL ABONEMENT</text>
  <text x="429" y="148" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="28" font-weight="bold">187</text>
  <text x="429" y="170" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11">Standard &amp; VIP</text>

  <!-- Metric Card 3: Bu oy tushumi -->
  <rect x="594" y="88" width="165" height="96" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="608" y="112" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">BU OY TUSHUMI</text>
  <text x="608" y="146" fill="#34d399" font-family="system-ui, sans-serif" font-size="22" font-weight="bold">35.4M so'm</text>
  <text x="608" y="170" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11">Bugun: 2.5M so'm</text>

  <!-- Alert Banner: 3 kun qolgan abonementlar -->
  <rect x="232" y="200" width="528" height="60" rx="12" fill="#451a03" fill-opacity="0.5" stroke="#f59e0b" stroke-width="1.5"/>
  <circle cx="260" cy="230" r="14" fill="#f59e0b" fill-opacity="0.2"/>
  <text x="254" y="235" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">!</text>
  <text x="286" y="226" fill="#fef08a" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Abonement muddati tugashidan oldin ogohlantirish (Avtomatik monitoring)</text>
  <text x="286" y="246" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">14 ta mijozning abonementi 3 kun ichida tugaydi. SMS / Tizim eslatmasi tayyor.</text>

  <!-- Table Preview -->
  <rect x="232" y="276" width="528" height="182" rx="12" fill="#0d1522" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="232" y="276" width="528" height="38" rx="12" fill="#131e30"/>
  <text x="250" y="300" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">MIJOZ</text>
  <text x="380" y="300" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">TARIF</text>
  <text x="490" y="300" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">MURABBIY</text>
  <text x="610" y="300" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">STATUS</text>

  <!-- Row 1 -->
  <text x="250" y="340" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Ali Valiyev</text>
  <text x="380" y="340" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12">Fitness Pro (1 oy)</text>
  <text x="490" y="340" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Aziz (Bodybuilding)</text>
  <rect x="610" y="324" width="68" height="22" rx="11" fill="#10b981" fill-opacity="0.2"/>
  <text x="625" y="339" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Faol</text>

  <!-- Row 2 -->
  <line x1="248" y1="360" x2="744" y2="360" stroke="#1e293b" stroke-width="1"/>
  <text x="250" y="390" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Madina Karimova</text>
  <text x="380" y="390" fill="#a855f7" font-family="system-ui, sans-serif" font-size="12">Yoga VIP (3 oy)</text>
  <text x="490" y="390" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Madina (Yoga)</text>
  <rect x="610" y="374" width="76" height="22" rx="11" fill="#f59e0b" fill-opacity="0.2"/>
  <text x="618" y="389" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">3 kun qoldi</text>

  <!-- Row 3 -->
  <line x1="248" y1="410" x2="744" y2="410" stroke="#1e293b" stroke-width="1"/>
  <text x="250" y="440" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Sardor Rahim</text>
  <text x="380" y="440" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12">Crossfit (6 oy)</text>
  <text x="490" y="440" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Sardor (Fitness)</text>
  <rect x="610" y="424" width="68" height="22" rx="11" fill="#10b981" fill-opacity="0.2"/>
  <text x="625" y="439" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Faol</text>
</svg>
